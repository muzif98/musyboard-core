# Separate crate, outside the core workspace: it needs nightly and libFuzzer
# and must not take part in `cargo test` / `cargo clippy` of the core.
[workspace]

[package]
name = "keyboard-cipher-core-fuzz"
version = "0.0.0"
license = "GPL-3.0-only"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.keyboard-cipher-core]
path = ".."

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

